<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">Workspace Portal</title>
  <desc id="desc">A secure, read-only view of projects, documentation and Git branches in a local workspace.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#080b10"/>
      <stop offset="0.58" stop-color="#0d1418"/>
      <stop offset="1" stop-color="#111b12"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#b7f36d"/>
      <stop offset="1" stop-color="#66d9d0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="48"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="480" rx="24" fill="url(#bg)"/>
  <circle cx="130" cy="20" r="190" fill="#b7f36d" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1080" cy="440" r="220" fill="#66d9d0" opacity="0.08" filter="url(#glow)"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
    <g transform="translate(70 76)">
      <rect width="172" height="28" rx="14" fill="#b7f36d" opacity="0.1" stroke="#b7f36d" stroke-opacity="0.28"/>
      <circle cx="17" cy="14" r="4" fill="#b7f36d"/>
      <text x="30" y="18" fill="#b7f36d" font-size="10" font-weight="800" letter-spacing="1">READ-ONLY BY DESIGN</text>
      <text x="0" y="86" fill="#f1f5f9" font-size="49" font-weight="800" letter-spacing="-1.5">Workspace Portal</text>
      <rect x="0" y="102" width="374" height="5" rx="2.5" fill="url(#line)"/>
      <text x="0" y="151" fill="#aab4c2" font-size="20">Your whole workspace. One calm view.</text>
      <text x="0" y="190" fill="#758195" font-size="15">Projects · Docs · Git branches · Search</text>

      <g transform="translate(0 232)">
        <rect width="150" height="42" rx="8" fill="#b7f36d"/>
        <text x="75" y="27" text-anchor="middle" fill="#0b1007" font-size="14" font-weight="750">Explore portal  →</text>
        <rect x="162" width="126" height="42" rx="8" fill="#111820" stroke="#303b48"/>
        <text x="225" y="27" text-anchor="middle" fill="#e6edf3" font-size="14" font-weight="650">Quick start</text>
      </g>
    </g>

    <g transform="translate(610 48)" filter="url(#shadow)">
      <rect width="520" height="378" rx="14" fill="#0d1219" stroke="#2b3542"/>
      <rect width="520" height="40" rx="14" fill="#131922"/>
      <path d="M0 40h520" stroke="#28313d"/>
      <circle cx="20" cy="20" r="5" fill="#3a4452"/>
      <circle cx="38" cy="20" r="5" fill="#3a4452"/>
      <circle cx="56" cy="20" r="5" fill="#3a4452"/>
      <rect x="88" y="12" width="214" height="16" rx="8" fill="#090d12"/>
      <text x="104" y="23" fill="#5f6b7b" font-size="9">workspace.lab / projects</text>

      <rect y="40" width="156" height="338" fill="#0a0f15"/>
      <path d="M156 40v338" stroke="#252e39"/>
      <g transform="translate(16 62)">
        <rect width="25" height="25" rx="6" fill="#192113" stroke="#526839"/>
        <text x="12.5" y="17" text-anchor="middle" fill="#b7f36d" font-size="10" font-weight="800">W</text>
        <text x="35" y="17" fill="#edf2f7" font-size="10" font-weight="700">Workspace</text>
        <text x="0" y="61" fill="#515d6d" font-size="7" font-weight="800" letter-spacing="1.2">CATALOG</text>
        <rect x="0" y="72" width="124" height="28" rx="5" fill="#151c25"/>
        <text x="10" y="90" fill="#b7f36d" font-size="9">▣  Projects</text>
        <text x="10" y="121" fill="#8d98a8" font-size="9">◇  Knowledge</text>
        <text x="10" y="150" fill="#8d98a8" font-size="9">⌕  Search</text>
        <rect x="0" y="254" width="124" height="45" rx="7" fill="#0e1219" stroke="#222a37"/>
        <circle cx="12" cy="271" r="3" fill="#b7f36d"/>
        <text x="21" y="274" fill="#bac2d0" font-size="8">read-only</text>
        <text x="12" y="289" fill="#596577" font-size="7">workspace mounted :ro</text>
      </g>

      <g transform="translate(181 65)">
        <text x="0" y="10" fill="#687386" font-size="8">Workspace / Projects / server</text>
        <text x="0" y="50" fill="#b7f36d" font-size="8" font-weight="800" letter-spacing="1.1">PROJECT</text>
        <text x="0" y="75" fill="#edf2f7" font-size="19" font-weight="750">workspace-portal</text>

        <g transform="translate(0 98)">
          <rect width="310" height="46" rx="7" fill="#111820" stroke="#28313d"/>
          <rect x="12" y="13" width="20" height="20" rx="3" fill="#151b24" stroke="#596474"/>
          <text x="22" y="26" text-anchor="middle" fill="#d4d9e2" font-size="5" font-weight="800">MD</text>
          <text x="43" y="21" fill="#c6ced8" font-size="10" font-weight="600">README.md</text>
          <text x="43" y="34" fill="#596577" font-size="7">Product overview</text>
          <text x="291" y="28" text-anchor="end" fill="#566172" font-size="13">›</text>
        </g>
        <g transform="translate(0 152)">
          <rect width="310" height="46" rx="7" fill="#111820" stroke="#28313d"/>
          <rect x="12" y="13" width="20" height="20" rx="3" fill="#151b24" stroke="#296ba4"/>
          <text x="22" y="26" text-anchor="middle" fill="#6eb9ff" font-size="5" font-weight="800">TS</text>
          <text x="43" y="21" fill="#c6ced8" font-size="10" font-weight="600">src</text>
          <text x="43" y="34" fill="#596577" font-size="7">Server and web application</text>
          <text x="291" y="28" text-anchor="end" fill="#566172" font-size="13">›</text>
        </g>
        <g transform="translate(0 206)">
          <rect width="310" height="46" rx="7" fill="#111820" stroke="#28313d"/>
          <rect x="12" y="13" width="20" height="20" rx="3" fill="#151b24" stroke="#2478a9"/>
          <text x="22" y="26" text-anchor="middle" fill="#6cbfff" font-size="4.5" font-weight="800">DKR</text>
          <text x="43" y="21" fill="#c6ced8" font-size="10" font-weight="600">Dockerfile</text>
          <text x="43" y="34" fill="#596577" font-size="7">Hardened runtime image</text>
          <text x="291" y="28" text-anchor="end" fill="#566172" font-size="13">›</text>
        </g>

        <g transform="translate(0 274)">
          <rect width="310" height="28" rx="6" fill="#192313" stroke="#35452a"/>
          <text x="11" y="18" fill="#b7f36d" font-size="8" font-weight="700">main</text>
          <text x="299" y="18" text-anchor="end" fill="#66d9d0" font-size="8">branch snapshot · safe</text>
        </g>
      </g>
    </g>
  </g>
</svg>
